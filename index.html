<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Check-In | Smart Attendance</title>
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        h2 { color: #333; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #result { margin-top: 20px; font-size: 1.2rem; font-weight: bold; padding: 15px; border-radius: 8px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <h2>📍 Main Gate: Smart Check-In</h2>
    <p>Scan your ID Card QR to enter the campus.</p>

    <!-- कैमरा यहाँ खुलेगा -->
    <div id="reader"></div>
    
    <!-- सक्सेस या एरर मैसेज यहाँ दिखेगा -->
    <div id="result"></div>

    <script type="module" src="src/main.js"></script>

</body>
</html>
